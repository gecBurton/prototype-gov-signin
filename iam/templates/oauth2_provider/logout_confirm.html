{% extends "oauth2_provider/base.html" %}
{% load i18n %}

{% block title %}{% trans "Sign out" %}{% endblock %}

{% block inner_content %}
  <h1 class="govuk-heading-l">{% trans "Sign out?" %}</h1>

  <p class="govuk-body">{% trans "This will end your Public Sector Sign-in session." %}</p>

  <form id="logoutForm" method="post">
    {% csrf_token %}

    <div class="govuk-button-group">
      <button type="submit" name="allow" value="Logout" class="govuk-button" data-module="govuk-button">
        {% trans "Sign out" %}
      </button>
      <button type="submit" class="govuk-button govuk-button--secondary" data-module="govuk-button">
        {% trans "Cancel" %}
      </button>
    </div>
  </form>
{% endblock %}
