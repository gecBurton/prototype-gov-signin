[project]
name = "prototype-gov-signin"
version = "0.1.0"
description = "A Django OpenID Connect identity provider where teams self-manage their OAuth applications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    # <66: the auto-enrol form (users/forms.py) extends allauth's login-by-code
    # internals, so major upgrades must be taken deliberately.
    "django-allauth>=65.18.0,<66",
    "django-gov-notify>=0.7.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    # Talks to Ory Hydra's admin API (users/hydra.py) — the OAuth2/OIDC
    # authorization server, replacing what django-oauth-toolkit used to do
    # in-process.
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "cryptography>=48.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-env>=1.6.0",
    "requests-mock>=1.12.1",
    "ruff>=0.15.16",
]
integration = [
    "pytest>=9.0.3",
    "pytest-playwright>=0.8.0",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings"
pythonpath = ["iam"]
# Tests run against PostgreSQL (start it with `make db`). The host/credentials
# match the docker compose `db` service; the remaining POSTGRES_* values fall
# back to "iam" in settings.py.
env = [
    "DEBUG=true",
    "SECRET_KEY=insecure-test-key",
    "POSTGRES_HOST=localhost",
]
