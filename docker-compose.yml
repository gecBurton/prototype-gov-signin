services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first init of postgres_data, to create a second
      # database for Hydra (see the file for why).
      - ./docker/init-hydra-db.sql:/docker-entrypoint-initdb.d/init-hydra-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI + REST API

  # Ory Hydra is the OAuth2/OIDC authorization server: it owns /oauth2/auth,
  # /oauth2/token, /userinfo, /.well-known/jwks.json and token/session
  # lifecycle. It has no user database of its own — it delegates every login,
  # consent and logout decision to the iam service (HYDRA login/consent/
  # logout URLs below), which is why iam depends on hydra rather than the
  # other way around.
  hydra-migrate:
    image: oryd/hydra:v2.3.0
    environment:
      DSN: "postgres://iam:iam@db:5432/hydra?sslmode=disable"
    entrypoint: ["hydra", "migrate", "sql", "-e", "--yes"]
    depends_on:
      db:
        condition: service_healthy

  hydra:
    image: oryd/hydra:v2.3.0
    entrypoint: ["hydra", "serve", "all", "--dev"]
    environment:
      DSN: "postgres://iam:iam@db:5432/hydra?sslmode=disable"
      # The browser-facing issuer/endpoints use localhost; container-to-
      # container admin calls (from iam) use the hydra:4445 service name —
      # see HYDRA_ADMIN_URL/HYDRA_PUBLIC_URL on the iam service below.
      URLS_SELF_ISSUER: "http://localhost:4444"
      URLS_LOGIN: "http://localhost:8000/o/login/"
      URLS_CONSENT: "http://localhost:8000/o/consent/"
      URLS_LOGOUT: "http://localhost:8000/o/logout/"
      SECRETS_SYSTEM: "insecure-dev-hydra-system-secret-32-chars-min"
    ports:
      - "4444:4444"   # public: authorize/token/jwks/userinfo
      - "4445:4445"   # admin: client CRUD, login/consent/logout challenges
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  iam:
    build: .
    # Seeds the demo relying party (Grafana) and a demo user so `make up` is a
    # working end-to-end demo and the integration tests have data to drive. This
    # lives here, in the compose layer that owns the demo stack, rather than as
    # an application management command.
    command:
      - sh
      - -c
      - |
        set -e
        cd iam
        uv run python manage.py migrate
        uv run python manage.py shell <<'PYEOF'
        from allauth.account.models import EmailAddress
        from django.contrib.auth import get_user_model
        from users import hydra
        from users.models import Team

        User = get_user_model()

        user, created = User.objects.get_or_create(email="demo@example.com")
        if created:
            user.set_unusable_password()
            user.save()
        EmailAddress.objects.get_or_create(
            user=user,
            email="demo@example.com",
            defaults={"primary": True, "verified": True},
        )

        # Every application must belong to a team, and a team admits users only
        # on the domains it lists. Allow example.com so the demo user can sign in.
        team, _ = Team.objects.get_or_create(name="Demo")
        team.allowed_email_domains.get_or_create(domain="example.com")

        existing = [a for a in hydra.list_team_applications(team.pk) if a.name == "Grafana"]
        if not existing:
            hydra.create_application(
                team_id=team.pk,
                name="Grafana",
                redirect_uris=["http://localhost:3000/login/generic_oauth"],
                skip_authorization=True,
                client_id="grafana",
                client_secret="grafana-secret",
            )
        PYEOF
        uv run python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      SECRET_KEY: "insecure-dev-key"
      POSTGRES_HOST: db
      POSTGRES_DB: iam
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
      ALLOWED_HOSTS: "localhost,iam,127.0.0.1"
      # The demo user is granted Django admin access on login (see ADMIN_USERS).
      ADMIN_USERS: "demo@example.com"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      # Container-to-container: iam calls Hydra's admin API directly, and
      # proxies its discovery document from the public API (see
      # users.views.DiscoveryInfoView). HYDRA_ADMIN_URL is never exposed
      # outside this compose network.
      HYDRA_ADMIN_URL: "http://hydra:4445"
      HYDRA_PUBLIC_URL: "http://hydra:4444"
      # "Sign in with Google" is wired to the local Dex stand-in (see the dex
      # service), so the flow works without real Google credentials. The
      # browser-facing URLs use localhost; the token exchange happens
      # container-to-container.
      GOOGLE_CLIENT_ID: iam
      GOOGLE_CLIENT_SECRET: iam-dex-secret
      GOOGLE_AUTHORIZE_URL: http://localhost:5556/dex/auth
      GOOGLE_ACCESS_TOKEN_URL: http://dex:5556/dex/token
      GOOGLE_ID_TOKEN_ISSUER: http://localhost:5556/dex
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      dex:
        condition: service_started
      hydra:
        condition: service_started

  dex:
    image: ghcr.io/dexidp/dex:latest
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./integration_tests/dex.yaml:/etc/dex/config.yaml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "IAM"
      # Pointed at the real SSO service to verify it works end-to-end. The
      # client_id/secret must be a client registered at that SSO service with
      # http://localhost:3000/login/generic_oauth as an allowed redirect URI;
      # supply them via the shell or .env (defaults are the demo values).
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "${SSO_CLIENT_ID:-grafana}"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${SSO_CLIENT_SECRET:-grafana-secret}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      # Grafana talks to Hydra's public endpoints directly — iam is no longer
      # the token issuer, only the login/consent decision-maker Hydra
      # delegates to (see the hydra service above).
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "http://localhost:4444/oauth2/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://hydra:4444/oauth2/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://hydra:4444/userinfo"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "http://localhost:8000/accounts/logout/"
    depends_on:
      - iam
      - hydra

volumes:
  postgres_data:
